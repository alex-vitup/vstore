name: deploy backend to ACA

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name vstoreacr

      - name: Build and push Docker image
        run: |
          docker build -t vstoreacr.azurecr.io/vstore-backend:${{ github.sha }} .
          docker build -t vstoreacr.azurecr.io/vstore-backend:latest .
          docker push vstoreacr.azurecr.io/vstore-backend:${{ github.sha }}
          docker push vstoreacr.azurecr.io/vstore-backend:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp create \
            --name vstore-backend \
            --resource-group vstore-rg \
            --environment vstore-env \
            --image vstoreacr.azurecr.io/vstore-backend:${{ github.sha }} \
            --target-port 8000 \
            --ingress external \
            --env-vars DATABASE_URL="postgresql://vstoreadmin:VerySecurePassword123!@vstore-pg-server.postgres.database.azure.com:5432/vstore_db"
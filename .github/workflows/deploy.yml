name: deploy backend to ACA

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: vstoreacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t vstoreacr.azurecr.io/vstore-backend:${{ github.sha }} .
          docker build -t vstoreacr.azurecr.io/vstore-backend:latest .
          docker push vstoreacr.azurecr.io/vstore-backend:${{ github.sha }}
          docker push vstoreacr.azurecr.io/vstore-backend:latest

      - name: Deploy to Azure Container App via REST API
        run: |
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.AZURE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "properties": {
                "template": {
                  "containers": [
                    {
                      "name": "vstore-backend",
                      "image": "vstoreacr.azurecr.io/vstore-backend:'"${{ github.sha }}"'"
                    }
                  ]
                }
              }
            }' \
            "https://management.azure.com/subscriptions/8a6db1d6-57a8-455a-98db-56f175eed6e8/resourceGroups/vstore-rg/providers/Microsoft.App/containerApps/vstore-backend?api-version=2023-05-01"
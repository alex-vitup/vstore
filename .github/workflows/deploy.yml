name: deploy backend to aca

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: log in to azure container registry
        uses: azure/docker-login@v1
        with:
          login-server: vstoreacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: build and push docker image
        run: |
          docker build -t vstoreacr.azurecr.io/vstore-backend:${{ github.sha }} .
          docker build -t vstoreacr.azurecr.io/vstore-backend:latest .
          docker push vstoreacr.azurecr.io/vstore-backend:${{ github.sha }}
          docker push vstoreacr.azurecr.io/vstore-backend:latest

      - name: deploy to azure container app
        run: |
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.AZURE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "properties": {
                "template": {
                  "containers": [
                    {
                      "name": "vstore-backend",
                      "image": "vstoreacr.azurecr.io/vstore-backend:'"${{ github.sha }}"'"
                    }
                  ]
                }
              }
            }' \
            "${{ secrets.AZURE_CONTAINER_APP_URL }}"